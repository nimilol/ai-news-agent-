# Settings for the AI news agent. Edit freely; the agent reads this file on every run.

# The companies you cover. An item from a general source (newsletter, Reddit, press) is kept
# only if its title or summary matches one of these patterns (regular expressions, case-insensitive).
companies:
  anthropic:
    label: "Claude / Anthropic"
    keywords: ['\banthropic\b', '\bclaude\b', 'claude code', '\bdario amodei\b', '\bopus [0-9]', '\bsonnet [0-9]', '\bhaiku [0-9]']
  openai:
    label: "GPT / OpenAI"
    keywords: ['\bopenai\b', '\bchatgpt\b', '\bgpt-?[0-9o]', '\bsora\b', '\bcodex\b', '\bsam altman\b', '\bgpt-oss\b']
  xai:
    label: "Grok / xAI"
    keywords: ['\bxai\b', '\bx\.ai\b', '\bgrok\b', '\bcolossus\b']
  zhipu:
    label: "GLM / Z.ai (Zhipu)"
    keywords: ['\bglm\b', '\bglm-?[0-9]', '\bchatglm\b', '\bzhipu\b', '\bz\.ai\b', '\bzai-org\b']
  free_models:
    # Filled only by the free-model sources (OpenRouter free tier, OpenCode), so no keywords.
    label: "🆓 New free models you can use"
    keywords: []

# How far back to look. Items older than this are ignored even if never seen before.
max_age_hours: 48
# The first time a source is read, only items from the last N hours are reported
# (everything older is quietly marked as seen, so the first digest isn't a flood).
first_run_hours: 12

digest:
  # Max items handed to the AI per run (most important first: official > leaks > community > newsletters > press).
  max_items: 80
  # Send a short "nothing new" message when a run finds nothing (useful to know the agent is alive).
  send_when_empty: true
  # Save every digest as a Markdown file in digests/ (your searchable archive).
  archive: true
  # Read the full article for this many top items (0 = headlines and summaries only).
  read_articles: 15
  article_chars: 2500

# Publishers whose stories are skipped (matched against the link's domain or the publisher name).
# These mostly rewrite other outlets' stories. Add any site you don't trust.
blocked_publishers: [blockchain.news, basenor, tikr.com, startuphub.ai]

alerts:
  # Max instant alerts per run (alerts never use AI, they just say "new post at X").
  max_per_run: 8

# AI providers, tried in this order. A provider is skipped when its key isn't set.
# Each "models" list is tried top to bottom, so a retired model just falls through to the next one.
# All of these have free tiers except anthropic. When you add ANTHROPIC_API_KEY, Claude is used first.
llm:
  order: [anthropic, gemini, groq, gemini_extra, openrouter, zai]
  providers:
    anthropic:
      key_env: ANTHROPIC_API_KEY
      # Change to "claude-haiku-4-5" for the cheapest option.
      models: [claude-opus-5-5]
    gemini:
      key_env: GEMINI_API_KEY
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      # If Google retires a model, its error message names the replacement: put that name here.
      models: [gemini-flash-latest, gemini-flash-lite-latest]
    gemini_extra:
      # gemini-3.8-flash has a small free daily limit, so it's tried after Groq.
      key_env: GEMINI_API_KEY
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      models: [gemini-3.8-flash]
    groq:
      key_env: GROQ_API_KEY
      base_url: https://api.groq.com/openai/v1
      models: [openai/gpt-oss-120b, llama-3.3-70b-versatile]
      # Groq's free tier limits tokens per minute, so it gets a shorter list and no article text.
      max_items: 35
      summary_chars: 200
      article_chars: 0
    openrouter:
      key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      headers: {X-Title: ai-news-agent}
      # "auto-free" picks the free model with the biggest context window from OpenRouter's live list.
      models: [auto-free]
    zai:
      key_env: ZAI_API_KEY
      base_url: https://api.z.ai/api/paas/v4
      models: [glm-4.5-flash]

# Builder picks: GitHub topics searched for fast-rising new repos (plus GitHub Trending, Hugging Face, Show HN).
builders:
  topics: [llm, ai-agents, mcp, agents, generative-ai, rag, coding-agent, local-llm]

# Buzz (every 3 hours): what's hot on GitHub and Hugging Face, "something to talk about".
buzz:
  max_picks: 8
  # GitHub topics searched for fast-rising new AI repos (GitHub Trending is read in full, AI or not).
  topics: [llm, ai-agents, mcp, generative-ai, coding-agent, local-llm, rag, llm-inference]
  # The labs you follow most: their repos and Hugging Face uploads are checked directly, and anything
  # mentioning them is marked FOCUS so the AI puts it first.
  gh_orgs: [anthropics, openai, zai-org, MoonshotAI, MiniMax-AI, xai-org, deepseek-ai, QwenLM, google-gemini, google-deepmind, meta-llama]
  hf_orgs: [openai, zai-org, moonshotai, MiniMaxAI, xai-org, deepseek-ai, Qwen, google, meta-llama]
  focus: ['\banthropic', '\bclaude\b', '\bopenai\b', '\bchatgpt\b', '\bgpt-?[0-9o]', '\bcodex\b', '\bglm', '\bzhipu\b',
          '\bz\.?ai\b', '\bkimi\b', '\bmoonshot', '\bminimax', '\bxai\b', '\bgrok\b', '\bdeepseek', '\bqwen',
          '\bgemini\b', '\bgemma\b', '\bllama\b', 'meta-llama']
  # Hugging Face and GitHub don't publish offers or censorship news, so these two news searches fill the gap.
  news_queries:
    - '("free for a limited time" OR "limited-time" OR "free access" OR "free tier" OR "discount") (Claude OR ChatGPT OR GPT OR GLM OR Kimi OR MiniMax OR Grok OR Gemini OR DeepSeek OR Qwen)'
    - '(AI model OR chatbot OR Claude OR ChatGPT OR Grok OR DeepSeek OR Qwen OR Kimi) (censored OR censorship OR uncensored OR restricted OR banned)'

# The /free command and the "free-models" run list every free model from these places.
free_models:
  # models.dev provider ids to include besides OpenRouter ("opencode" = OpenCode's free models).
  models_dev_providers: [opencode]

delivery:
  telegram: true   # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID
  email: true      # needs EMAIL_ADDRESS and EMAIL_APP_PASSWORD (EMAIL_TO optional)
  smtp_host: smtp.gmail.com
  smtp_port: 465
