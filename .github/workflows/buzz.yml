name: Buzz (GitHub + Hugging Face)

# Every 3 hours: the most talked-about repos, models, papers and news on GitHub and Hugging Face,
# with a talking point for each. Uses one AI request per run.
on:
  schedule:
    - cron: "47 */3 * * *"   # 00:47, 03:47, 06:47 … UTC
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [buzz, preview]
        default: buzz

permissions:
  contents: write

concurrency:
  group: agent-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Find what's hot
        env:
          MODE: ${{ inputs.mode || 'buzz' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$MODE" = "preview" ]; then
            python -m agent buzz --dry-run   # full Buzz in this log; nothing sent, nothing saved
          else
            python -m agent buzz
          fi

      - name: Save memory
        if: ${{ (inputs.mode || 'buzz') == 'buzz' }}
        run: |
          git config user.name "ai-news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -m "buzz: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
