name: Instant alerts

# Every hour: checks only the official sources marked `alert: true` in sources.yaml and pings you on
# Telegram when a new post appears. No AI involved. GitHub may start scheduled runs a few minutes late
# when it is busy. Hourly keeps a private repository well inside GitHub's free 2,000 minutes a month.
# If you make the repository public (unlimited free minutes), you can use "*/30 * * * *" for every 30 minutes.
# Each run also checks the official model-release sources of six AI labs (python -m agent releases): see README →
# "Model release alerts". Note: GitHub skips many scheduled runs when it is busy; in practice this has run every
# 4-9 hours. The optional Cloudflare trigger in the README starts the release check on time instead.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check official model releases
        continue-on-error: true  # a problem here never stops the instant alerts below
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent releases

      - name: Check official sources
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m agent alerts

      - name: Save memory
        # Always: a release alert Telegram already confirmed must be remembered even if a later step failed,
        # or it would be sent again. (The alerts step itself never writes its state when its delivery fails.)
        if: always()
        run: |
          git config user.name "ai-news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state releases
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -m "alerts: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
