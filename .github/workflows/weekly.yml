name: Weekly recap

# Sunday evening: the weekly intelligence report from the saved briefs, with content opportunities.
on:
  schedule:
    - cron: "53 17 * * 0"   # Sundays 17:53 UTC (18:53 in Lagos)
  workflow_dispatch:

permissions:
  contents: write   # to keep the latest report for the /weekly command (state/last_weekly.json)

concurrency:
  group: agent-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write the weekly recap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m agent weekly

      - name: Save the report for /weekly
        run: |
          git config user.name "ai-news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -m "weekly: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
